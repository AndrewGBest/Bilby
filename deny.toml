# What `cargo deny check` holds the dependencies to. CI runs it on every push.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The systems Bilby is built for; dependencies of other systems are not looked at.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
]

[advisories]
# A known security problem in any dependency fails the check. An unmaintained crate
# fails it only when Bilby depends on it directly: the sign-in window's web view is
# built on the GTK 3 bindings, which are no longer maintained and which only their
# users upstream (wry, tao) can replace.
unmaintained = "workspace"
# An entry here needs a reason.
ignore = [
  # glib 0.18: `VariantStrIter` is unsound. It is only made by
  # `Variant::array_iter_str`, which nothing in Bilby or in the GTK 3 crates it
  # is built with calls (checked 2026-11-24). glib 0.18 is the last for GTK 3, so
  # this stays until wry and tao move to GTK 4.
  { id = "RUSTSEC-2024-0429", reason = "the unsound iterator is not used; no fixed glib exists for GTK 3" },
]

[licenses]
# Licences that may be combined with Bilby's own (GPL-3.0-only). A dependency under
# anything else fails the check until someone has read its licence and added it.
allow = [
  "GPL-3.0-only",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate make the program bigger, not wrong.
multiple-versions = "allow"
wildcards = "deny"
# Bilby's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
# Everything comes from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
