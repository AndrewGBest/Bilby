name: Release

# Pushing a tag like v0.2.0 builds the store for each desktop system and attaches the
# files to a GitHub release. The file names follow the convention the store's own
# classifier understands, which is how an installed copy finds its update.
#
# What is published, per system:
#   Linux    an AppImage (one file, runs as it is) and a .tar.gz with the command-line tool
#   Windows  bilby.exe on its own (runs as it is) and a .zip with the command-line tool
#   macOS    a .dmg holding Bilby.app and a .tar.gz with the command-line tool
#
# It can also be started by hand from the Actions page with the version to release;
# the release then creates the tag, on the commit the workflow ran from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.2.0"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu on purpose: what is built here runs on anything newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev
      - run: cargo build --release --target ${{ matrix.target }} -p bilby -p bilby-cli
      # The sign-in window. On Windows and macOS it is part of bilby itself; on Linux it
      # is its own program, so bilby starts on systems without WebKitGTK.
      - if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }} -p bilby-signin
      - name: Package
        shell: bash
        run: |
          name="bilby-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/bilby.exe" "target/${{ matrix.target }}/release/bilby-cli.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/bilby" "target/${{ matrix.target }}/release/bilby-cli" "$name/"
            if [ -f "target/${{ matrix.target }}/release/bilby-signin" ]; then
              cp "target/${{ matrix.target }}/release/bilby-signin" "$name/"
            fi
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fL --retry 3 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sh packaging/linux/build-appimage.sh "target/${{ matrix.target }}/release/bilby" "$PWD/appimagetool" \
            "$PWD/bilby-${VERSION}-x86_64.AppImage"
          rm appimagetool
      - name: Windows program
        if: runner.os == 'Windows'
        shell: bash
        run: cp "target/${{ matrix.target }}/release/bilby.exe" "bilby-${VERSION}-x86_64-windows.exe"
      - name: macOS app
        if: runner.os == 'macOS'
        run: |
          app="dmg/Bilby.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/bilby" "$app/Contents/MacOS/bilby"
          sed "s/__VERSION__/${VERSION#v}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # The icon in the sizes macOS asks for. An app without one still runs.
          mkdir bilby.iconset
          for size in 16 32 128 256; do
            sips -z $size $size packaging/bilby.png --out "bilby.iconset/icon_${size}x${size}.png"
            sips -z $((size * 2)) $((size * 2)) packaging/bilby.png --out "bilby.iconset/icon_${size}x${size}@2x.png"
          done
          cp packaging/bilby.png bilby.iconset/icon_512x512.png
          iconutil -c icns bilby.iconset -o "$app/Contents/Resources/bilby.icns" || echo "no icon"
          # Not signed by a registered developer; this marks it as whole, which Apple
          # silicon requires before it will start anything.
          codesign --force --deep -s - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname Bilby -srcfolder dmg -ov -format UDZO "bilby-${VERSION}-aarch64-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            bilby-v*.AppImage
            bilby-v*.exe
            bilby-v*.dmg
            bilby-v*.zip
            bilby-v*.tar.gz
          if-no-files-found: error

  # The Android package: one APK for phones, tablets and TVs with a 64-bit ARM
  # processor, signed with the project's own key (kept in the repository's secrets).
  android:
    runs-on: ubuntu-latest
    env:
      # The drawing library underneath comes ready-built against this NDK and no older one.
      NDK: 30.0.16248370
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"
      - run: cargo install cargo-apk --locked
      - name: Build and sign
        working-directory: crates/app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the key there is no APK, and the rest of the release goes ahead.
          [ -n "$KEYSTORE" ] || { echo "::warning::No Android package: the signing key is not in the repository's secrets"; exit 0; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks" cargo apk build --lib --release
          rm -f "$RUNNER_TEMP/release.jks"
          cp ../../target/release/apk/bilby.apk "../../bilby-${VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bilby-android
          path: bilby-*.apk
          if-no-files-found: ignore

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" bilby-* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
