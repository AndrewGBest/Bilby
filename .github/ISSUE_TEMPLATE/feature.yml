name: A concrete request
description: Something specific Bilby should do. For a loose idea, start a discussion instead.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, before any solution.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What should Bilby do
    validations:
      required: true
  - type: checkboxes
    id: where
    attributes:
      label: Where it matters
      options:
        - label: Desktop
        - label: TV
        - label: Phone
        - label: Command line
  - type: textarea
    id: fits
    attributes:
      label: How it fits
      description: >
        Bilby keeps no server, no account and no tracking, and leaves some things out
        on purpose (see docs/COMPARISON.md). Say if your request touches any of that.
