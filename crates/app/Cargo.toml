[package]
name = "bilby"
description = "An app store that only shows what runs on your device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# cdylib is what Android loads; rlib is what the desktop binary links.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bilby"
path = "src/main.rs"

[dependencies]
bilby-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg"] }
png = "0.18"
# Translations are kept as JSON; the system says which language it is set to.
serde_json = "1"
sys-locale = "0.3"
# App pictures are PNGs or JPEGs. Slint's own "image-default-formats" would pull in every
# format the image crate knows (AVIF, EXR, WebP, ...); two decoders are enough.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Remote controls send keys Slint does not pass on (Back, above all); this gives access
# to the window system's own events so they can be translated.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["unstable-winit-030", "system-tray"] }
# The quiet sounds that go with moving about. Playback only: the sounds are made in
# code, so no decoders are needed.
rodio = { version = "0.21", default-features = false, features = ["playback"] }

# Asking a Wayland window system for leave to bring another program's window to the
# front, with the serial of the press that asked for it (see src/activation.rs). The
# same libraries, at the same versions, that the windowing code underneath already uses.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# The window for signing in to another store on its own page. On Linux it is a separate
# program (bilby-signin), so the store starts without the web engine being installed.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
bilby-signin = { path = "../signin" }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
# Asking Android's Java side to open things (see src/android.rs). The version the
# Android backend underneath already uses.
jni = "0.22"

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"

[build-dependencies]
slint-build = "1.19"

# The Android package (built with `cargo apk build --lib`, see docs/ANDROID.md). One
# APK serves phones, tablets and TVs: the launcher entry for a phone, and the one a
# TV's home screen looks for.
[package.metadata.android]
package = "io.github.andrewgbest.bilby"
apk_name = "bilby"
# 64-bit ARM only: the drawing library underneath (Skia) comes ready-built for it and
# not for 32-bit ARM, which some older phones and TV sticks still use. An emulator on
# a PC is built for by naming its target: `--target x86_64-linux-android`.
build_targets = ["aarch64-linux-android"]
resources = "../../packaging/android/res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Installing what was downloaded goes through Android's own installer, which asks.
[[package.metadata.android.uses_permission]]
name = "android.permission.REQUEST_INSTALL_PACKAGES"

# A TV has no touch screen, and a phone is not a TV: neither is required.
[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[package.metadata.android.application]
label = "Bilby"
icon = "@mipmap/ic_launcher"
banner = "@drawable/banner"

[package.metadata.android.application.activity]
label = "Bilby"
launch_mode = "singleTask"
config_changes = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]
