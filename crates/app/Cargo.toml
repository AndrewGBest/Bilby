[package]
name = "bilby"
description = "App store for GitHub Releases, Codeberg and other repositories that only shows what runs on your device"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib is what Android loads; rlib is what the desktop binary links.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bilby"
path = "src/main.rs"

[dependencies]
bilby-core = { path = "../core" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg"] }
png = "0.17"
# App pictures are PNGs or JPEGs. Slint's own "image-default-formats" would pull in every
# format the image crate knows (AVIF, EXR, WebP, ...); two decoders are enough.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Remote controls send keys Slint does not pass on (Back, above all); this gives access
# to the window system's own events so they can be translated.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["unstable-winit-030"] }
# The quiet sounds that go with moving about. Playback only: the sounds are made in
# code, so no decoders are needed.
rodio = { version = "0.21", default-features = false, features = ["playback"] }

# The window for signing in to another store on its own page. On Linux it is a separate
# program (bilby-signin), so the store starts without the web engine being installed.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
bilby-signin = { path = "../signin" }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"

[build-dependencies]
slint-build = "1.19"
