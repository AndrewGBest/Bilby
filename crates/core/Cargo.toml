[package]
name = "bilby-core"
description = "What Bilby knows and decides: the device, the sources, which file fits, and installing it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["net"]
# Real HTTP (rustls). Without it the crate is pure Rust: classification, compatibility,
# planning and the demo catalog still work, which is what the cross-target checks use.
net = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Reading the system's own package databases (pacman sync DBs, apt lists). All pure Rust.
tar = { version = "0.4", default-features = false }
flate2 = "1"
ruzstd = "0.9.1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame", "safe-decode"] }
# Drawing a sign-in code for a phone to scan. Pure Rust, no image code.
qrcode = { version = "0.14", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
